name: Refresh listings

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild from Nasdaq Trader
        run: tools/build_listings.py > crates/omacharts-engine/src/listings.tsv
      - name: Open a pull request if anything listed or delisted
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Refresh the generated symbol listings'
          title: 'Refresh the generated symbol listings'
          body: |
            Rebuilt from Nasdaq Trader's daily files by `tools/build_listings.py`.
            The diff is every symbol that listed or delisted since the last run.
          branch: listings-refresh
          delete-branch: true
          add-paths: crates/omacharts-engine/src/listings.tsv
